<div class="task-list-container">
  @if (loading) {
    <div class="loading-message">Cargando tareas...</div>
  } @else if (tasks.length === 0) {
    <div class="empty-state">
      <p>No hay tareas. ¡Crea una para comenzar!</p>
    </div>
  } @else {
    <div class="task-list">
      @for (task of tasks; track trackByTaskId($index, task)) {
        <app-task-item
          [task]="task"
          (toggleStatus)="onToggleTask(task.id, $event)"
          (edit)="onEditTask(task.id)"
          (delete)="onDeleteTask(task.id)"
        ></app-task-item>
      }
    </div>
  }
</div>
